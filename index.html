<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaf Sweeper</title>
  <!-- Empty icon: stops the browser asking for /favicon.ico and logging a 404 error -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <p id="error" hidden></p>
  <p id="paused" hidden>Paused (press P)</p>
  <!-- FPS counter (press F to hide or show) -->
  <pre id="stats"></pre>
  <!-- Counter, progress bar and timer, bottom center -->
  <div id="hud">
    <span id="hud-count">Cleared 0 / 0</span>
    <div id="hud-bar"><div id="hud-fill"></div></div>
    <span id="hud-time">0:00.0</span>
    <button id="reset" type="button" title="New layout, timer back to 0 (R)">Reset</button>
    <button id="add" type="button" title="Add 100 leaves">+100</button>
  </div>
  <!-- Wind compass, bottom right: shows the wind, does not control it -->
  <div id="compass" aria-label="Wind direction and strength">
    <svg viewBox="-50 -50 100 100" width="88" height="88" aria-hidden="true">
      <circle r="46" class="dial"/>
      <text y="-35" class="north">N</text>
      <!-- The arrow points up (bearing 0); main.js rotates and scales it. -->
      <g id="compass-arrow">
        <line x1="0" y1="22" x2="0" y2="-22"/>
        <polygon points="0,-32 -8,-18 8,-18"/>
      </g>
    </svg>
    <div id="compass-label">Calm</div>
  </div>
  <!-- Win card, shown when every leaf is cleared -->
  <div id="win" hidden>
    <div class="card">
      <h2>All clear!</h2>
      <p id="win-time"></p>
      <div class="buttons">
        <button id="again" type="button">Play again</button>
        <button id="more" type="button">+100 leaves</button>
      </div>
    </div>
  </div>
  <!-- type="module" lets our files import each other (needs a local server, see README) -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
