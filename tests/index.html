<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaf Sweeper tests</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 16px; background: #1b1410; color: #f0e6da; font: 14px system-ui, sans-serif; }
    h1 { font-size: 18px; }
    #summary { font-weight: bold; margin: 12px 0; }
    li { margin: 2px 0; }
    .pass { color: #8fd18f; }
    .fail { color: #ff8a8a; }
    .message { color: #ffc9c9; margin-left: 24px; white-space: pre-wrap; }
    /* The test canvases must be laid out to have a size, but they do not need to be seen. */
    #canvases { height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <h1>Leaf Sweeper tests</h1>
  <p id="summary">Running...</p>
  <ul id="results"></ul>
  <div id="canvases"></div>

  <script type="module">
    import { test, getResults } from './harness.js';

    const summary = document.querySelector('#summary');
    const list = document.querySelector('#results');

    const files = [
      './math.test.js',
      './physics.test.js',
      './loop.test.js',
      './random.test.js',
      './fps.test.js',
      './pack.test.js',
      './noise.test.js',
      './void.test.js',
      './game.test.js',
      './control.test.js',
      './obstacles.test.js',
      './leafmesh.test.js',
      './tint.test.js',
      './crowd.test.js',
      './render.test.js',
    ];
    // Importing a test file runs its tests. Each file is loaded on its own, so one broken file
    // does not stop the others, and it is counted as a failed test instead of disappearing.
    for (const file of files) {
      try {
        await import(file);
      } catch (err) {
        console.error(err);
        test('load ' + file, () => { throw err; });
      }
    }

    const results = getResults();
    let failed = 0;
    for (const r of results) {
      const item = document.createElement('li');
      item.className = r.ok ? 'pass' : 'fail';
      item.textContent = (r.ok ? 'PASS  ' : 'FAIL  ') + r.name;
      if (!r.ok) {
        failed++;
        const message = document.createElement('div');
        message.className = 'message';
        message.textContent = r.message;
        item.appendChild(message);
      }
      list.appendChild(item);
    }
    if (results.length > 0) {
      summary.textContent = `${results.length - failed} of ${results.length} tests passed`;
      summary.className = failed === 0 ? 'pass' : 'fail';
    }
    // Lets an automated check read the outcome.
    window.testSummary = { total: results.length, failed };
  </script>
</body>
</html>
